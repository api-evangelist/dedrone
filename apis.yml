name: Dedrone
description: Dedrone is a counter-drone (counter-UAS) airspace security company that
  detects, tracks, identifies, and helps mitigate unauthorized drones and unmanned
  aerial systems. Its AI-powered sensor platform combines RF detection, radar, cameras,
  and mitigation technologies to protect airports, critical infrastructure, correctional
  facilities, stadiums, and government and military sites. Dedrone was acquired by
  Axon and operates as its counter-drone / airspace-security line. Surfaced through
  the API Evangelist network as a portfolio company of Felicis and Menlo Ventures;
  no public developer API, portal, or specification was found during enrichment.
